[pytest]
testpaths = tests

# `--strict-markers` : un marqueur mal orthographié devient une erreur au lieu
# d'un avertissement. Sans lui, `@pytest.mark.e2ee` se lit comme un marqueur
# inconnu que pytest ignore, et le test sort silencieusement de tout filtre.
addopts = --strict-markers

# Un test qui pend bloque le job jusqu'au délai du runner, sans dire lequel.
# Exige `pytest-timeout`, figé dans requirements-dev.txt.
timeout = 60
