name: Build reproductible & sécurité

# Trois déclencheurs, trois rôles distincts :
#  - push/PR      : empêcher d'introduire une dépendance non bornée ou un lock désynchronisé
#  - schedule     : détecter une dérive AMONT (nouvelle majeure, nouvelle CVE) AVANT qu'elle ne
#                   bloque un déploiement. C'est le déclencheur qui manquait : mcp 2.0.0 est sorti
#                   et a rendu la v0.4.1 inreconstructible sans que rien ne le signale (issue #2).
#  - dispatch     : rejeu manuel avant une release
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  coherence-version:
    name: Cohérence VERSION / tag / CHANGELOG
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # le garde compare HEAD aux tags : historique complet requis
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Garde de cohérence
        # Échoue si `main` porte un VERSION correspondant à un tag qui pointe un
        # AUTRE commit — la branche a alors dérivé sous un numéro déjà publié et
        # personne ne peut savoir quoi déployer. Vécu le 2026-08-06 : la
        # plateforme a reçu deux cibles de déploiement en cinq minutes.
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            python3 scripts/check_release_coherence.py --tag "${GITHUB_REF_NAME}"
          else
            python3 scripts/check_release_coherence.py
          fi

  gardes-statiques:
    name: Gardes dépendances & CVE
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installer pip-audit
        run: pip install --quiet pip-audit
      - name: Bornes, lock, cohérence, CVE
        # Ne demande ni serveur ni conteneur : les sondes image sont SKIP ici,
        # elles sont couvertes par le job build-image.
        run: python3 scripts/test_service.py --test reproducibility --no-docker

  suite-unitaire:
    name: Suite unitaire
    runs-on: ubuntu-latest
    # Un test qui pend ne doit pas immobiliser un runner jusqu'à la limite par
    # défaut. `pytest-timeout` borne chaque test, ceci borne le job.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        # Le lock donne les versions de production, requirements-dev.txt le
        # harnais. Rien n'est réépinglé ici : deux sources de vérité pour une
        # version de pytest finissent toujours par diverger.
        run: |
          python -m pip install --quiet -r requirements.lock
          python -m pip install --quiet -r requirements-dev.txt

      - name: Vérifier que la suite n'a pas rétréci
        # Un `collect_ignore`, un renommage de fichier ou un import cassé
        # retirent des tests de la collecte SANS produire un seul échec : la
        # suite passe au vert en testant moins. Seul un plancher le voit.
        # Ce garde ne couvre PAS un `pytest.mark.skip` massif, qui reste
        # visible dans le résumé d'exécution.
        run: |
          plancher=101
          n="$(python -m pytest tests -q --collect-only 2>/dev/null | grep -c '::' || true)"
          printf 'tests collectés : %s, plancher %s\n' "$n" "$plancher"
          if [ "$n" -lt "$plancher" ]; then
            echo "la suite a rétréci : des tests ont quitté la collecte sans qu aucun échec ne le dise"
            exit 1
          fi

      - name: Vérifier que le magasin de tokens reste couvert
        # Complémentaire du plancher global, pas redondant, et la frontière
        # est mesurée : nommer le fichier contourne `collect_ignore`, donc ce
        # garde-ci NE voit PAS une exclusion par conftest. Il voit la
        # suppression et le renommage du fichier, que le plancher global
        # manquerait si des tests étaient ajoutés ailleurs au même moment.
        # Le plancher global, lui, voit `collect_ignore`. Il faut les deux.
        run: |
          plancher=48
          n="$(python -m pytest tests/test_token_store.py -q --collect-only 2>/dev/null | grep -c '::' || true)"
          printf 'tests du magasin de tokens : %s, plancher %s\n' "$n" "$plancher"
          if [ "$n" -lt "$plancher" ]; then
            echo "les tests du magasin de tokens ont disparu de la collecte"
            exit 1
          fi

      - name: Lancer la suite
        run: python -m pytest tests -q

      - name: Table de mutations du magasin de tokens
        # Ce que les deux planchers ci-dessus NE voient pas : un test qu'on
        # vide de son corps en gardant son nom. La collecte ne bouge pas,
        # `pytest` reste vert, et la protection a disparu. Une relecture l'a
        # démontré en remettant un défaut de sécurité en place sans qu'aucun
        # garde ne réagisse.
        #
        # Ce script remet chaque correctif dans son état d'origine et exige
        # qu'au moins un test tombe. Il répond donc à la question que le
        # comptage ne pose pas : les assertions protègent-elles encore ?
        # Vingt-trois secondes, pour une garantie qui tenait jusqu'ici d'une
        # mesure faite une fois à la main.
        run: python scripts/mutations_magasin_tokens.py

  build-image:
    name: Build frais, démarrage, scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build de l'image de service
        run: docker build -t mcp-tools:ci .

      - name: Build de l'image sandbox
        run: docker build -t mcp-tools-sandbox:ci ./sandbox

      - name: Surface d'import réellement utilisée par le code
        # L'issue #2 ne visait que l'import serveur ; le client casse aussi en
        # mcp 2.0.0, ce qu'un simple healthcheck ne verrait pas.
        run: |
          docker run --rm --entrypoint python mcp-tools:ci -c "from mcp.server import MCPServer; from mcp.server.mcpserver import Context"
          docker run --rm --entrypoint python mcp-tools:ci -c "from mcp import ClientSession; from mcp.client.streamable_http import streamable_http_client"
          docker run --rm --entrypoint python mcp-tools:ci -m pip check

      - name: Démarrage et healthcheck
        run: |
          docker run -d --name ci-svc -p 8050:8050 \
            -e ADMIN_BOOTSTRAP_KEY=ci_startup_probe_key mcp-tools:ci
          for i in $(seq 1 20); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' ci-svc)" = "healthy" ] && break
            sleep 3
          done
          test "$(docker inspect -f '{{.State.Health.Status}}' ci-svc)" = "healthy"
          curl -sf http://localhost:8050/health >/dev/null
          docker rm -f ci-svc

      - name: Recette E2E — sous-ensemble hermétique
        # Health/MCP, auth, date, calc sandboxé, WAF et parité CLI/admin,
        # sans cible Internet, écriture S3 ni secret externe. La recette
        # complète reste une qualification manuelle — voir README §4.
        run: |
          cp .env.example .env
          CI_ADMIN_BOOTSTRAP_KEY="ci_e2e_$(openssl rand -hex 16)"
          sed -i "s/^ADMIN_BOOTSTRAP_KEY=.*/ADMIN_BOOTSTRAP_KEY=${CI_ADMIN_BOOTSTRAP_KEY}/" .env
          python3 -m pip install --quiet -r requirements.lock
          DOCKER_GID="$(stat -c '%g' /var/run/docker.sock)" MCP_TOKEN="${CI_ADMIN_BOOTSTRAP_KEY}" \
            python3 scripts/test_service.py --test date,calc,waf,cli-smoke,auth

      - name: Scan CVE des deux images
        # `pip-audit` n'audite QUE le Python : il ne voit ni la couche OS, ni la
        # stdlib Go embarquée dans le binaire Docker CLI statique. D'où ce scan.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: mcp-tools:ci
          severity: CRITICAL,HIGH
          format: table
          exit-code: "0"

      - name: Scan CVE sandbox
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: mcp-tools-sandbox:ci
          severity: CRITICAL,HIGH
          format: table
          exit-code: "0"
